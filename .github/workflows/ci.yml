name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch quando um novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários
        run: npm test

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest

    # Banco Postgres efêmero só para este job (não é o do docker-compose)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codequest
          POSTGRES_PASSWORD: codequest_ci
          POSTGRES_DB: codequest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codequest -d codequest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://codequest:codequest_ci@localhost:5432/codequest_test
      JWT_SECRET: oECOtM3qyAliSHj3L0aVhq6XSqa+oXnmyAsZIHcxW8I=
      JWT_EXPIRES_IN: 15m

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes de integração
        run: npm run test:integration

      - name: Cobertura de código
        run: npm run test:coverage
